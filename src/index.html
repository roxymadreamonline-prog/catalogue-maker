<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue Maker</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/themes.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <!-- Top Controls -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Project</h3>
        <div class="button-group">
          <button id="btn-new" class="btn btn-primary" title="New Project">+ New</button>
          <button id="btn-open" class="btn btn-secondary" title="Open Project">Open</button>
          <button id="btn-save" class="btn btn-secondary" title="Save Project">Save</button>
        </div>
      </div>

      <!-- Page Controls -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Pages</h3>
        <div id="pages-list" class="pages-list"></div>
        <button id="btn-add-page" class="btn btn-accent">+ Add Page</button>
      </div>

      <!-- Layout Controls -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Layout</h3>
        <div class="control-group">
          <label>Columns</label>
          <input id="layout-columns" type="number" min="1" max="6" value="3" class="input-number">
        </div>
        <div class="control-group">
          <label>Gap (px)</label>
          <input id="layout-gap" type="number" min="0" max="50" value="20" class="input-number">
        </div>
        <div class="control-group">
          <label>Card Size</label>
          <select id="layout-card-size" class="input-select">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div id="custom-size-controls" style="display:none;">
          <div class="control-group">
            <label>Width (mm)</label>
            <input id="custom-width" type="number" min="10" max="200" value="80" class="input-number">
          </div>
          <div class="control-group">
            <label>Height (mm)</label>
            <input id="custom-height" type="number" min="10" max="200" value="120" class="input-number">
          </div>
        </div>
      </div>

      <!-- Text Controls -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Text</h3>
        <div class="control-group">
          <label>Caption Size (pt)</label>
          <input id="text-size" type="number" min="6" max="24" value="12" class="input-number">
        </div>
        <div class="control-group">
          <label>Line Height</label>
          <input id="text-line-height" type="number" min="1" max="2.5" step="0.1" value="1.4" class="input-number">
        </div>
        <div class="checkbox-group">
          <input id="auto-fit-text" type="checkbox" checked>
          <label for="auto-fit-text">Auto-fit text</label>
        </div>
      </div>

      <!-- Header Controls -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Header</h3>
        <div class="checkbox-group">
          <input id="header-enabled" type="checkbox">
          <label for="header-enabled">Enable Header</label>
        </div>
        <div id="header-controls" style="display:none;">
          <div class="control-group">
            <label>Text</label>
            <input id="header-text" type="text" class="input-text" placeholder="Header text">
          </div>
          <div class="control-group">
            <label>Style</label>
            <select id="header-style" class="input-select">
              <option value="plain">Plain</option>
              <option value="top-strip">Top Strip</option>
              <option value="soft-wave">Soft Wave</option>
            </select>
          </div>
          <div class="control-group">
            <label>Language</label>
            <select id="header-language" class="input-select">
              <option value="en">English</option>
              <option value="bg">Bulgarian</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Theme -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Theme</h3>
        <div class="theme-buttons">
          <button class="theme-btn" data-theme="default" title="Default Theme">Default</button>
          <button class="theme-btn" data-theme="dark" title="Dark Theme">Dark</button>
          <button class="theme-btn" data-theme="glass" title="Glass Theme">Glass</button>
        </div>
        <div id="glass-controls" style="display:none;">
          <div class="control-group">
            <label>Blur (px)</label>
            <input id="glass-blur" type="number" min="0" max="20" value="10" class="input-number">
          </div>
          <div class="control-group">
            <label>Opacity</label>
            <input id="glass-opacity" type="range" min="0" max="100" value="80" class="input-range">
          </div>
        </div>
      </div>

      <!-- Export -->
      <div class="sidebar-section">
        <h3 class="sidebar-title">Export</h3>
        <div class="button-group">
          <button id="btn-export-png" class="btn btn-secondary">PNG</button>
          <button id="btn-export-pdf" class="btn btn-secondary">PDF</button>
        </div>
        <div class="checkbox-group" style="margin-top: 12px;">
          <input id="export-transparent" type="checkbox">
          <label for="export-transparent">Transparent PNG</label>
        </div>
      </div>

      <!-- Display Toggle -->
      <div class="sidebar-section">
        <button id="btn-fullscreen" class="btn btn-secondary">Fullscreen</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- A4 Preview -->
      <div class="preview-wrapper">
        <div id="preview" class="preview-a4"></div>
      </div>
    </main>

    <!-- File Manager Sidebar -->
    <aside class="file-sidebar">
      <div class="file-manager">
        <h3 class="sidebar-title">Assets</h3>
        
        <!-- File Tabs -->
        <div class="file-tabs">
          <button class="file-tab active" data-filter="all">All</button>
          <button class="file-tab" data-filter="png">PNG</button>
          <button class="file-tab" data-filter="jpg">JPG</button>
          <button class="file-tab" data-filter="psd">PSD</button>
          <button class="file-tab" data-filter="pdf">PDF</button>
          <button class="file-tab" data-filter="other">Other</button>
        </div>

        <!-- Search -->
        <div class="file-search">
          <input id="file-search" type="text" class="input-text" placeholder="Search files...">
        </div>

        <!-- Import Buttons -->
        <div class="file-import-buttons">
          <button id="btn-import" class="btn btn-accent btn-sm">Import Files</button>
          <button id="btn-scan" class="btn btn-secondary btn-sm">Scan Folder</button>
        </div>

        <!-- Files List -->
        <div id="files-list" class="files-list"></div>
      </div>
    </aside>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;"></div>
  
  <div id="modal-edit-card" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Edit Card</h3>
      <div class="form-group">
        <label>Caption</label>
        <textarea id="modal-caption" class="input-textarea"></textarea>
      </div>
      <div class="form-group">
        <label>Thumbnail Image</label>
        <select id="modal-thumbnail" class="input-select">
          <option value="">None</option>
        </select>
      </div>
      <div class="form-group">
        <label>Thumbnail Position</label>
        <select id="modal-thumbnail-position" class="input-select">
          <option value="top-right">Top Right</option>
          <option value="top-left">Top Left</option>
          <option value="bottom-right">Bottom Right</option>
          <option value="bottom-left">Bottom Left</option>
        </select>
      </div>
      <div class="form-group">
        <label>Thumbnail Size</label>
        <input id="modal-thumbnail-size" type="number" min="20" max="100" value="40" class="input-number">
      </div>
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveCardEdit()">Save</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/themes.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/headers.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/filemanager.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
